# ============================================================
# Docker Compose — n8n Self-hosted + PostgreSQL + Ollama
# Para desarrollo local y aprendizaje de infraestructura
# ============================================================
# Uso:
#   docker compose up -d          # Arrancar
#   docker compose logs -f n8n    # Ver logs
#   docker compose down           # Detener
# ============================================================

version: "3.8"

services:
  # ─── n8n ───────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # --- General ---
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-cambio-me-por-una-clave-segura}
      - N8N_USER_FOLDER=/home/node/.n8n
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168                   # Limpiar ejecuciones > 7 días

      # --- PostgreSQL (base de datos de n8n) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8nuser
      - DB_POSTGRESDB_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}

      # --- Timezone ---
      - GENERIC_TIMEZONE=America/Caracas
    volumes:
      - n8n_data:/home/node/.n8n
      - ./backups:/backups                          # Para backups manuales
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n_network

  # ─── PostgreSQL (para n8n) ─────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"                                 # Expuesto para conexiones externas
    environment:
      - POSTGRES_USER=n8nuser
      - POSTGRES_PASSWORD=${DB_POSTGRESDB_PASSWORD:-n8npass}
      - POSTGRES_DB=n8n
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8nuser -d n8n"]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - n8n_network

  # ─── Ollama (IA local gratuita) ─────────────────────────
  # Opcional: Descargar modelos con:
  #   docker compose exec ollama ollama pull llama3.2
  #   docker compose exec ollama ollama pull mistral
  ollama:
    image: ollama/ollama:latest
    container_name: n8n-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - n8n_network

  # ─── pgAdmin (gestión de BD, opcional) ─────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: n8n-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@iducdev.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin123}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - n8n_network

volumes:
  n8n_data:
  postgres_data:
  ollama_data:
  pgadmin_data:

networks:
  n8n_network:
    driver: bridge
